[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aifw-cli"
version = "0.4.0"
description = "Agent-independent AI Software Engineering Framework control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[project.scripts]
aifw = "aifw.cli:main"
aifw-hook = "aifw.hooks:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.12,<1", "setuptools>=75", "wheel>=0.45"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
pythonpath = ["python"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
