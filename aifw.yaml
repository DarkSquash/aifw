apiVersion: aifw.dev/v1alpha1
kind: Project
metadata:
  id: aifw
  name: AI Software Engineering Framework
spec:
  frameworkVersion: 0.4.1
  projectType: existing
  locale: pt-BR
  primaryEnvironment: windows
  validationTargets:
  - windows
  - wsl
  - linux-ci
  profiles: []
  dataClassification: internal
  externalAllowlist:
  - context7
  - github
  - openrouter
  assessment:
    mode: shadow
    features:
    - tasks
    - impasse
    - context
    - intake
    - traceability
    - decisions
    - judge
