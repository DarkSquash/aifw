name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check python tests_python scripts setup.py
      - run: uv run --no-sync ruff format --check python tests_python scripts setup.py
      # argparse wraps usage lines differently before Python 3.13; the reference follows 3.13+.
      - if: matrix.python == '3.13'
        run: uv run --no-sync python scripts/generate_cli_reference.py --check
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python -m build --no-isolation
      - run: uv pip install --python .venv --reinstall dist/aifw_cli-0.4.1-py3-none-any.whl
      - run: uv run --no-sync python scripts/verify_wheel.py
