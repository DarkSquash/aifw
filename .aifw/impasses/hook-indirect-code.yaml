proposal:
  suspectedRuleId: threat-model.md da mudança hook-indirect-code (revisão independente julga o hook como sandbox contra agente adversário)
  explanation: 'Duas revisões independentes reprovaram: cada rodada fecha os casos apontados e a seguinte acha novas formas de indireção (variáveis de ambiente, configs de ferramentas, regras implícitas do make). Ler texto não consegue garantir contenção contra um agente adversário.'
  proposedChange: 'Opção 1 escolhida pelo usuário em 2026-10-20: o hook protege contra erros do agente e caminhos óbvios, não contra agente determinado. Corrigir as regressões N1 (node -r/--require/--import) e N3 (yarn/pnpm publish), e os casos baratos: variáveis de ambiente na linha que executam programas (GIT_SSH_COMMAND, GIT_EXTERNAL_DIFF, GIT_CONFIG_*, NODE_OPTIONS, BASH_ENV, npm_config_script_shell), make SHELL=/--eval/-E/vários -f, npm --script-shell. O restante vira risco residual declarado no threat model e no ADR-0034, com o sandbox do Claude Code como contenção real. A próxima revisão julga contra esse modelo.'
