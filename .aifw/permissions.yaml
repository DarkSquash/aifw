apiVersion: aifw.dev/v1alpha1
kind: PermissionPolicy
localGit: autonomous
remoteMutation: human-approval
previewDeployment: autonomous
productionDeployment: human-approval
destructiveChanges: human-approval
externalServices:
  writes: human-approval
# Approvals count only in a signed, unchanged commit: an agent cannot sign with the person's key.
approvals:
  requireSignedCommit: true
# Packages that npx/uvx may download and run without asking (ADR-0025).
trustedPackages:
  - ctx7
childAgents:
  capabilityCeiling: parent
breakGlass:
  enabled: true
  requiresIncidentId: true
  requiresHumanApproval: true
  expires: true
