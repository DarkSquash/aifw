apiVersion: aifw.dev/v1alpha1
kind: CapabilitySpec
capability: task-assessor
title: Avaliador de tarefas
purpose: Avaliar cada pedido da pessoa e, depois da ativação humana, entregar ao agente o caminho de execução, sem nunca rebaixar a aprovação humana.
requirements:
- id: REQ-ASSESSOR-COMPLEXITY-PATH
  strength: MUST
  statement: O caminho de execução deve vir só da complexidade (trivial L0, simples L1, moderada L2, alta L3), e o risco deve decidir a exceção de L0/L1 e a governança, sem que uma avaliação de risco alto ou crítico perca o pedido de aprovação e os revisores.
  scenarios:
  - id: SCN-ASSESSOR-COMPLEXITY-PATH
    given:
    - Avaliações com cada complexidade, combinadas com risco baixo, médio, alto e crítico e com importância baixa e crítica.
    when:
    - O avaliador escolhe o caminho e monta o contexto do pedido.
    then:
    - O caminho é FAST, WORK, PLANNED ou CRITICAL pela complexidade, qualquer que seja a importância.
    - O contexto descreve a cascata do nível; com risco alto ou crítico em L0 ou L1, cita a exceção (aifw-executor ou aifw-senior sozinho) e os dois revisores; com risco alto ou crítico em qualquer nível, cita o plano aprovado no chat.
- id: REQ-ASSESSOR-HOOK-INSTALL
  strength: MUST
  statement: O hook de pedidos deve rodar sempre em primeiro plano, porque grava a aprovação do plano e entrega o caminho antes de o agente ler a mensagem.
  scenarios:
  - id: SCN-ASSESSOR-HOOK-INSTALL
    given:
    - Um projeto com o Claude Code habilitado, inclusive com a entrada antiga async e o hook do juiz.
    when:
    - aifw claude enable roda de novo.
    then:
    - O hook de pedidos deixa de ser async, o hook do juiz sai, e aifw claude check só acusa diferença antes disso.
- id: REQ-ASSESSOR-PATH
  strength: MUST
  statement: Com o recurso tasks ligado, cada pedido da pessoa deve chegar ao agente com o caminho de execução, sem ativação, e uma falha do serviço não deve bloquear o pedido.
  scenarios:
  - id: SCN-ASSESSOR-PATH
    given:
    - O recurso tasks em spec.assessment.features.
    when:
    - A pessoa envia um pedido, ou o serviço de decisão está fora.
    then:
    - O hook entrega o caminho com risco, importância e complexidade, ou só um aviso de indisponível; uma mensagem automática não é avaliada.
